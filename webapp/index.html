<!doctype html>
<html lang="ru" data-theme="grey">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Wispie VPN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- темы ---------- */
:root,[data-theme="grey"]{
  --bg-base:#c9cfd9;
  --bg-grad:radial-gradient(900px 520px at 20% -10%,rgba(255,255,255,.5),transparent 60%),linear-gradient(170deg,#d6dbe4 0%,#c2c9d5 55%,#b5bdca 100%);
  --ink:#1b2030; --ink2:#4a5366; --ink3:#6f788d;
  --glass:rgba(255,255,255,.2); --edge:rgba(255,255,255,.55); --hl:rgba(255,255,255,.75);
  --sheen:linear-gradient(115deg,rgba(255,255,255,.22),rgba(255,255,255,0) 55%);
  --shadow:0 10px 28px rgba(30,40,70,.14);
  --navy:#4b3fa0;
  --accent:#7a68c9; --accent-ink:#4b3fa0; --accent-edge:rgba(122,104,201,.75);
  --accent-glow:rgba(122,104,201,.38); --accent-bg:rgba(122,104,201,.14);
  --ghost:rgba(255,255,255,.35); --field:rgba(255,255,255,.4); --chip:rgba(255,255,255,.35);
  --tb-bg:rgba(255,255,255,.55); --tb-edge:rgba(255,255,255,.8);
  --pl-bg:rgba(255,255,255,.95); --pl-edge:rgba(122,104,201,.4);
  --blob:rgba(122,104,201,.22); --track:rgba(47,59,87,.14);
  --tag:#4b3fa0; --focus:rgba(122,104,201,.25); --toast:rgba(255,255,255,.75);
  --ok:#2e9c77; --bad:#c0566b; --btn-a:#7a68c9; --btn-b:#9d8ee0;
}
[data-theme="white"]{
  --bg-base:#e4e7ed;
  --bg-grad:radial-gradient(900px 520px at 20% -10%,rgba(255,255,255,.7),transparent 60%),linear-gradient(170deg,#eef0f5 0%,#e0e4ec 100%);
  --ink:#1b2030; --ink2:#50596c; --ink3:#838ca2;
  --glass:rgba(255,255,255,.4); --edge:rgba(255,255,255,.75); --hl:#fff;
  --sheen:linear-gradient(115deg,rgba(255,255,255,.4),rgba(255,255,255,0) 55%);
  --shadow:0 10px 26px rgba(40,50,80,.1);
  --navy:#4d3fa3;
  --accent:#8270d0; --accent-ink:#4d3fa3; --accent-edge:rgba(130,112,208,.7);
  --accent-glow:rgba(130,112,208,.3); --accent-bg:rgba(130,112,208,.12);
  --ghost:rgba(255,255,255,.55); --field:rgba(255,255,255,.6); --chip:rgba(255,255,255,.55);
  --tb-bg:rgba(255,255,255,.7); --tb-edge:rgba(255,255,255,.9);
  --pl-bg:#fff; --pl-edge:rgba(130,112,208,.35);
  --blob:rgba(130,112,208,.15); --track:rgba(58,70,100,.12);
  --tag:#4d3fa3; --focus:rgba(130,112,208,.22); --toast:rgba(255,255,255,.85);
  --ok:#2e9c77; --bad:#c0566b; --btn-a:#8270d0; --btn-b:#a494e6;
}
[data-theme="black"]{
  --bg-base:#07080c;
  --bg-grad:radial-gradient(800px 500px at 90% -10%,rgba(90,110,170,.1),transparent 60%),#07080c;
  --ink:#eef1f7; --ink2:#a7afc2; --ink3:#7b849a;
  --glass:rgba(255,255,255,.035); --edge:rgba(255,255,255,.09); --hl:rgba(255,255,255,.06);
  --sheen:none;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --navy:#cfc2ff;
  --accent:#a58cff; --accent-ink:#cfc2ff; --accent-edge:rgba(165,140,255,.6);
  --accent-glow:rgba(165,140,255,.28); --accent-bg:rgba(165,140,255,.1);
  --ghost:rgba(255,255,255,.06); --field:rgba(255,255,255,.05); --chip:rgba(255,255,255,.06);
  --tb-bg:rgba(16,16,24,.72); --tb-edge:rgba(255,255,255,.1);
  --pl-bg:rgba(255,255,255,.1); --pl-edge:rgba(165,140,255,.35);
  --blob:rgba(120,140,220,.14); --track:rgba(255,255,255,.1);
  --tag:#5b4ab8; --focus:rgba(165,140,255,.2); --toast:rgba(20,20,30,.85);
  --ok:#4fd2a0; --bad:#ff7a94; --btn-a:#5b4ab8; --btn-b:#8c7ce0;
}
[data-theme="galaxy"]{
  --bg-base:#0a0920;
  --bg-grad:radial-gradient(1000px 600px at 15% 0%,#3b1f6e 0%,transparent 60%),radial-gradient(800px 500px at 100% 100%,#123a6e 0%,transparent 55%),#0a0920;
  --ink:#f1eeff; --ink2:#b9b1da; --ink3:#857ea9;
  --glass:rgba(140,120,255,.06); --edge:rgba(170,150,255,.18); --hl:rgba(255,255,255,.08);
  --sheen:none;
  --shadow:0 10px 30px rgba(10,5,40,.5);
  --navy:#f0dcff;
  --accent:#c77dff; --accent-ink:#f0dcff; --accent-edge:rgba(199,125,255,.6);
  --accent-glow:rgba(199,125,255,.3); --accent-bg:rgba(199,125,255,.1);
  --ghost:rgba(255,255,255,.07); --field:rgba(255,255,255,.06); --chip:rgba(255,255,255,.07);
  --tb-bg:rgba(30,20,60,.6); --tb-edge:rgba(190,170,255,.2);
  --pl-bg:rgba(199,125,255,.14); --pl-edge:rgba(199,125,255,.45);
  --blob:rgba(167,139,250,.3); --track:rgba(255,255,255,.1);
  --tag:#6d4fd6; --focus:rgba(199,125,255,.22); --toast:rgba(40,30,80,.85);
  --ok:#5be0b4; --bad:#ff7a94; --btn-a:#6d4fd6; --btn-b:#c77dff;
}
[data-theme="red"]{
  --bg-base:#120508;
  --bg-grad:radial-gradient(900px 500px at 90% -10%,#4a0d18 0%,transparent 60%),#120508;
  --ink:#fdecee; --ink2:#d1a0a6; --ink3:#9a6d74;
  --glass:rgba(255,70,90,.05); --edge:rgba(255,120,130,.16); --hl:rgba(255,255,255,.07);
  --sheen:none;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --navy:#ffc7d9;
  --accent:#ff5f8f; --accent-ink:#ffc7d9; --accent-edge:rgba(255,95,143,.6);
  --accent-glow:rgba(255,95,143,.3); --accent-bg:rgba(255,95,143,.1);
  --ghost:rgba(255,255,255,.06); --field:rgba(255,255,255,.05); --chip:rgba(255,255,255,.07);
  --tb-bg:rgba(40,10,16,.6); --tb-edge:rgba(255,130,140,.2);
  --pl-bg:rgba(255,95,143,.14); --pl-edge:rgba(255,95,143,.45);
  --blob:rgba(255,80,100,.26); --track:rgba(255,255,255,.1);
  --tag:#b3202e; --focus:rgba(255,95,143,.22); --toast:rgba(50,12,20,.85);
  --ok:#5be0b4; --bad:#ff7a94; --btn-a:#b3202e; --btn-b:#ff5f8f;
}

/* ---------- база ---------- */
:root{--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg-base);touch-action:pan-y;-webkit-text-size-adjust:100%}
body,button,a{touch-action:pan-y;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
html,body{min-height:100%}
body{font-family:'Manrope',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg-grad);
  padding:18px 16px calc(110px + env(safe-area-inset-bottom));overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.view>*{animation:rise .5s var(--ease) both}
.view.noanim>*{animation:none}
.view>*:nth-child(2){animation-delay:.04s}
.view>*:nth-child(3){animation-delay:.08s}
.view>*:nth-child(4){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:6px 4px 4px}
.title{font-size:26px;font-weight:800;letter-spacing:-.025em;margin:0 4px 14px}
h3{font-size:15px;font-weight:700;margin-bottom:6px}
.muted{color:var(--ink2);font-size:14px;line-height:1.5}
.small{font-size:13px}
.tiny{font-size:11.5px;line-height:1.45;color:var(--ink2)}
.center{text-align:center}
.big{font-size:36px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:8px 0 4px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1;margin:0}
.row2{display:flex;gap:8px}
.row2 .btn{margin-top:10px;flex:1}

/* стекло: спокойное, без белой заливки в тёмных темах */
.glass{position:relative;overflow:hidden;margin-bottom:12px;padding:16px;border-radius:22px;background:var(--glass);
  border:1px solid var(--edge);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);
  box-shadow:var(--shadow),inset 0 1px 0 var(--hl);transition:transform .35s var(--ease)}
.glass::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:var(--sheen)}
.glass>*{position:relative;z-index:1}
.glass.tap{cursor:pointer}
.glass.tap:active{transform:scale(.985)}
.hero::before{content:"";position:absolute;width:240px;height:240px;right:-110px;top:-120px;border-radius:50%;
  background:radial-gradient(circle,var(--blob),transparent 65%);z-index:0}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px;
  background:var(--chip);border:1px solid var(--edge)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad)}
.chip.ok i{background:var(--ok);box-shadow:0 0 8px var(--ok)}

.bar{height:7px;border-radius:8px;background:var(--track);overflow:hidden;margin-top:12px}
.bar span,.prog span{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--btn-a),var(--btn-b));
  box-shadow:0 0 10px var(--accent-glow);transition:width .8s var(--ease)}
.prog{height:9px;border-radius:9px;background:var(--track);overflow:hidden;margin:12px 0 6px}

/* кнопки: тусклый фиолетовый с обводкой и свечением, под каждую тему свой */
.btn{display:block;width:100%;margin-top:10px;padding:13px;border-radius:15px;cursor:pointer;
  font:800 14.5px 'Manrope',sans-serif;color:var(--accent-ink);background:var(--accent-bg);
  border:1px solid var(--accent-edge);box-shadow:0 0 16px var(--accent-glow),inset 0 0 12px var(--accent-bg);
  transition:transform .25s var(--ease),box-shadow .3s}
.btn:hover{box-shadow:0 0 24px var(--accent-glow),inset 0 0 14px var(--accent-bg)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.ghost{color:var(--ink);background:var(--ghost);border-color:var(--edge);box-shadow:none}
.btn.danger{color:var(--bad);border-color:rgba(192,86,107,.6);background:rgba(192,86,107,.1);box-shadow:0 0 14px rgba(192,86,107,.25)}
.btn.sm{display:inline-block;width:auto;margin-top:0;padding:8px 13px;border-radius:12px;font-size:12.5px}
.view>.btn{margin:0 0 12px}

input{width:100%;margin:6px 0;padding:12px 13px;border-radius:14px;border:1px solid var(--edge);background:var(--field);
  font:600 16px 'Manrope',sans-serif;color:var(--ink);outline:none;transition:border-color .25s,box-shadow .25s}
input::placeholder{color:var(--ink3)}
input:focus{border-color:var(--accent-edge);box-shadow:0 0 0 3px var(--focus)}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0 2px}
.chipb{border:1px solid var(--edge);background:var(--chip);color:var(--ink);font:700 12.5px 'Manrope',sans-serif;
  padding:7px 13px;border-radius:99px;cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s}
.chipb.on{color:var(--accent-ink);border-color:var(--accent-edge);box-shadow:0 0 12px var(--accent-glow);background:var(--accent-bg)}
.chipb[disabled]{opacity:.4;pointer-events:none}
.chipb:active{transform:scale(.95)}
.pick{display:flex;gap:8px;justify-content:center;margin:10px 0}
.item{padding:10px 2px;border-top:1px solid var(--edge)}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:16px;background:var(--chip);
  border:1px solid var(--edge);margin-bottom:12px}
.seg button{border:0;background:none;padding:9px 4px;border-radius:12px;font:700 12.5px 'Manrope',sans-serif;color:var(--ink2);cursor:pointer;transition:all .3s var(--ease)}
.seg button.on{background:var(--pl-bg);color:var(--accent-ink);box-shadow:0 0 12px var(--accent-glow)}

.plan{display:flex;align-items:center;gap:12px}
.plan.best{border-color:var(--accent-edge);box-shadow:var(--shadow),0 0 16px var(--accent-glow)}
.plan-icon{width:46px;height:46px;flex:none;border-radius:15px;display:grid;place-items:center;background:var(--chip);
  border:1px solid var(--edge);color:var(--accent-ink)}
.plan-icon .i{width:24px;height:24px}
.plan-info{flex:1;min-width:0}
.plan-days{font-size:17px;font-weight:800}
.plan-buy{text-align:right;min-width:104px}
.price{font-size:17px;font-weight:800;margin-bottom:4px}
.tag{position:absolute;top:-1px;right:14px;font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:3px 9px;border-radius:0 0 9px 9px;background:var(--tag);color:#fff}

.shopitem{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shopitem h3{margin:0 0 2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{text-align:center;padding:14px 8px;margin-bottom:0}
.stat b{display:block;font-size:20px;font-weight:800}
.stat span{font-size:12px;color:var(--ink2)}

.pfs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0 2px}
.pf{border:1px solid var(--edge);background:var(--chip);color:var(--ink);font:700 12.5px 'Manrope',sans-serif;padding:11px;border-radius:14px;cursor:pointer;text-align:left}
.pf.on{color:var(--accent-ink);border-color:var(--accent-edge);background:var(--accent-bg);box-shadow:0 0 12px var(--accent-glow)}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
#qr{background:#fff;padding:9px;border-radius:16px}
#qr img,#qr canvas{display:block}
.steps-dots{display:flex;gap:6px;justify-content:center;margin:10px 0}
.steps-dots i{width:7px;height:7px;border-radius:50%;background:var(--track)}
.steps-dots i.on{background:var(--accent);box-shadow:0 0 8px var(--accent-glow)}
.stepbox{font-size:14.5px;line-height:1.5;min-height:68px}

.dev{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--edge)}
.devinfo{min-width:0}
.devbtns{display:flex;gap:6px;flex-shrink:0}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--track);margin-right:6px;vertical-align:middle}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.expand{margin-top:10px;padding-top:10px;border-top:1px solid var(--edge)}
@keyframes expandIn{from{opacity:0;max-height:0;transform:translateY(-10px)}to{opacity:1;max-height:420px;transform:none}}
.slider{width:100%;-webkit-appearance:none;appearance:none;height:6px;border-radius:6px;margin:14px 0 10px;outline:none;
  background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--track) var(--p,0%))}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--accent);
  border:2px solid var(--bg-base);box-shadow:0 0 12px var(--accent-glow)}
.slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--accent);border:2px solid var(--bg-base);box-shadow:0 0 12px var(--accent-glow)}
.res{text-align:center;font-weight:700;min-height:22px;margin:8px 0 2px;font-size:13px}
.legal{font-size:11.5px;color:var(--ink3);text-align:center;margin:12px 6px 0;line-height:1.5}

/* ---------- нижняя навигация: компактная капсула ---------- */
.tabbar{--n:4;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));
  width:min(92vw,360px);z-index:5;display:grid;grid-template-columns:repeat(var(--n),1fr);padding:4px;border-radius:999px;
  background:var(--tb-bg);border:1px solid var(--tb-edge);
  backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
  box-shadow:0 12px 28px rgba(0,0,0,.28)}
.pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / var(--n));border-radius:999px;
  background:var(--pl-bg);border:1px solid var(--pl-edge);box-shadow:0 0 14px var(--accent-glow);
  transition:transform .5s cubic-bezier(.34,1.3,.64,1)}
.tab{position:relative;z-index:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:7px 0 6px;color:var(--ink3);font:700 10px 'Manrope',sans-serif;cursor:pointer;transition:color .3s}
.tab .i{width:19px;height:19px;transition:transform .4s var(--ease),filter .3s}
.tab.on{color:var(--accent-ink)}
.tab.on .i{filter:drop-shadow(0 0 5px var(--accent-glow));transform:translateY(-1px)}
.tab:active .i{transform:scale(.88)}

.toast{position:fixed;left:50%;bottom:98px;z-index:9;transform:translateX(-50%);white-space:nowrap;padding:10px 16px;border-radius:99px;
  font-weight:700;font-size:13.5px;color:var(--ink);background:var(--toast);border:1px solid var(--edge);
  box-shadow:0 10px 26px rgba(0,0,0,.25);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  animation:toastIn .3s var(--ease) both;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.swd{display:block;width:38px;height:38px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 4px 10px rgba(0,0,0,.18);transition:box-shadow .35s var(--ease),transform .35s var(--ease)}
.swcol{transition:transform .3s var(--ease)}
.swcol.on .swd{box-shadow:0 0 0 2px var(--bg-base),0 0 0 4px var(--accent),0 0 18px var(--accent-glow)}
.swcol:active .swd{transform:scale(.9)}
.sbox{position:relative;height:34px;margin:14px 0 10px}
.sdots{position:absolute;inset:0;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.sdot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--track);background:transparent;transition:background .35s var(--ease),border-color .35s,box-shadow .35s,transform .35s var(--ease)}
.sdot.on{background:var(--accent);border-color:var(--accent);box-shadow:0 0 8px var(--accent-glow)}
.sdot.cur{transform:scale(1.4);box-shadow:0 0 0 3px var(--bg-base),0 0 0 5px var(--accent),0 0 16px var(--accent-glow)}
#devslider{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0;cursor:pointer;-webkit-appearance:none;appearance:none;background:transparent;border:0}
#devslider::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:34px;background:transparent}
#devslider::-moz-range-thumb{width:28px;height:34px;background:transparent;border:0}
.theming *{transition:background-color .6s var(--ease),color .6s var(--ease),border-color .6s var(--ease),box-shadow .6s var(--ease),fill .6s var(--ease) !important}
::view-transition-old(root),::view-transition-new(root){animation-duration:.6s;animation-timing-function:var(--ease)}
.expwrap{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .5s var(--ease),opacity .35s var(--ease)}
.expwrap.open{grid-template-rows:1fr;opacity:1}
.expwrap>div{min-height:0;overflow:hidden}
#guidecard.swap{animation:stepIn .42s var(--ease) both}
@keyframes stepIn{from{opacity:.25;transform:translateX(16px)}to{opacity:1;transform:none}}
.hero{padding:22px 20px}
.hero .big{font-size:46px}
.hero .chip{font-size:13px;padding:6px 13px}

<script>
const tg = window.Telegram?.WebApp;
try { tg?.ready(); tg?.expand(); } catch {}
const INIT = tg?.initData || "";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- темы ---------- */
const THEMES = {
  grey:   { name:"Серая",     swatch:"#c9cfd9", tg:"#c9cfd9", fx:{ mode:"orbs",   count:7,  colors:["255,255,255","140,150,172"] } },
  white:  { name:"Белая",     swatch:"#f3f4f7", tg:"#e4e7ed", fx:{ mode:"orbs",   count:6,  colors:["255,205,160","160,190,255","255,255,255"] } },
  black:  { name:"Черная",    swatch:"#101218", tg:"#06070a", fx:{ mode:"stars",  count:40, colors:["230,236,255"] } },
  galaxy: { name:"Галактика", swatch:"#3b1f6e", tg:"#0a0920", fx:{ mode:"stars",  count:45, colors:["225,215,255","160,230,255","255,235,200"] } },
  red:    { name:"Красная",   swatch:"#7a1622", tg:"#120508", fx:{ mode:"embers", count:28, colors:["255,120,130","255,190,120"] } },
};
let fx = THEMES.grey.fx;

function tgTheme() {
  return tg?.colorScheme === "light" ? "grey" : "black";
}

function applyTheme(key) {
  const t = THEMES[key];
  const needReset = fx.mode !== t.fx.mode || fx.count !== t.fx.count || !parts.length;
  document.documentElement.dataset.theme = key;
  fx = t.fx;
  if (needReset) resetBg();
  else parts.forEach(p => { p.c = fx.colors[Math.floor(Math.random() * fx.colors.length)]; });
  // на время смены темы плавно переходят цвета всех элементов
  const root = document.documentElement;
  root.classList.add("theming");
  clearTimeout(root._themeTimer);
  root._themeTimer = setTimeout(() => root.classList.remove("theming"), 700);
  try { tg?.setHeaderColor?.(t.tg); tg?.setBackgroundColor?.(t.tg); } catch {}
  document.querySelectorAll(".swcol").forEach(b => b.classList.toggle("on", b.dataset.theme === key));
}

function setTheme(key) {
  if (!THEMES[key] || key === document.documentElement.dataset.theme) return;
  try { localStorage.setItem("wispie-theme", key); } catch {}
  // где поддерживается, весь экран плавно перетекает в новую тему
  if (document.startViewTransition && !reduceMotion) {
    document.startViewTransition(() => applyTheme(key));
  } else {
    applyTheme(key);
  }
}

function themeCard() {
  const cur = document.documentElement.dataset.theme || "grey";
  return `
    <section class="glass">
      <h3>Оформление</h3>
      <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px">${Object.entries(THEMES).map(([k, t]) => `
        <button class="swcol ${k === cur ? "on" : ""}" data-theme="${k}" style="display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--ink2);font:700 10px 'Manrope',sans-serif;cursor:pointer">
          <span class="swd" style="background:${t.swatch}"></span>${t.name}
        </button>`).join("")}
      </div>
    </section>`;
}

/* ---------- данные ---------- */
const PLATFORMS = {
  windows:{name:"Windows", steps:["Скачайте Hiddify с официального сайта или GitHub и установите.","Нажмите «Скопировать ссылку» на этой странице.","В Hiddify нажмите «+» и выберите добавление из буфера обмена.","Выберите профиль и нажмите «Подключить».","Готово, VPN работает."]},
  ios:{name:"iOS", steps:["Установите Streisand или V2Box из App Store.","Нажмите «Скопировать ссылку» на этой странице.","В приложении добавьте подписку из буфера обмена.","Выберите сервер и включите подключение.","Готово, VPN работает."]},
  android:{name:"Android", steps:["Установите Hiddify или V2rayNG.","Нажмите «Скопировать ссылку» на этой странице.","В приложении добавьте подписку из буфера обмена.","Выберите сервер и подключитесь.","Готово, VPN работает."]},
  macos:{name:"macOS", steps:["Установите Hiddify или V2Box.","Нажмите «Скопировать ссылку».","Добавьте подписку из буфера обмена.","Выберите сервер и подключитесь.","Готово, VPN работает."]},
  linux:{name:"Linux", steps:["Скачайте Hiddify для Linux.","Нажмите «Скопировать ссылку».","Добавьте подписку из буфера обмена.","Подключитесь к выбранному серверу.","Готово, VPN работает."]},
  appletv:{name:"Apple TV", steps:["Установите Streisand на Apple TV из App Store.","На iPhone откройте этот раздел и отсканируйте QR-код.","Добавьте подписку в приложении на Apple TV.","Выберите сервер и подключитесь.","Готово, VPN работает."]},
  androidtv:{name:"Android TV", steps:["Установите Hiddify на Android TV из Google Play.","Отсканируйте QR-код с телефона или вставьте ссылку.","Добавьте подписку в приложении.","Выберите сервер и подключитесь.","Готово, VPN работает."]},
};
const SYMS = ["🍒","🍋","🔔","💎","7️⃣","⭐"];
const KIND = { plan:"Подписка", balance:"Подписка с баланса", topup:"Пополнение баланса", devices:"Устройства", gift:"Подарок" };

const state = {
  me: null, tab: "home", moreSub: "profile", platform: "windows", guideOpen: false, step: 0,
  expand: false, addCount: 1, devInfo: null, giftDays: 30,
};
let renderId = 0;

const plural = n => { const a = n % 100, b = n % 10; if (a > 10 && a < 20) return "дней"; if (b === 1) return "день"; if (b >= 2 && b <= 4) return "дня"; return "дней"; };
const fmtDate = iso => new Date(iso).toLocaleDateString("ru-RU", {day:"numeric", month:"long", year:"numeric"});
const fmtDT = iso => new Date(iso).toLocaleString("ru-RU", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
function ago(iso) {
  const s = (Date.now() - Date.parse(iso)) / 1000;
  if (s < 60) return "только что";
  if (s < 3600) return Math.floor(s / 60) + " мин назад";
  if (s < 86400) return Math.floor(s / 3600) + " ч назад";
  return Math.floor(s / 86400) + " дн назад";
}
const TABS = [["home","Главная","home"],["plans","Тарифы","money"],["sub","Подписка","link"],["more","Остальное","users"],["support","Поддержка","chat"],["admin","Админ","shield"]];
const TEMPLATES = [
  "Здравствуйте! Подскажите, пожалуйста, что именно не работает?",
  "Проверьте, что подписка активна, и обновите ссылку в приложении.",
  "Спасибо, вопрос решён. Если появятся ещё вопросы, пишите.",
  "Передали разработчикам, ответим, как только будет решение.",
];
const tabKeys = () => TABS.filter(([k]) => k === "sub" ? state.me?.active : k === "admin" ? state.me?.is_admin : k === "support" ? !state.me?.is_admin : true);

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: {"Content-Type": "application/json", "X-Init-Data": INIT},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    const msg = typeof data.detail === "string" ? data.detail : (r.status >= 500 ? "Сервер временно недоступен" : "Ошибка запроса");
    throw new Error(msg);
  }
  return data;
}

function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Скопировано"); }
  catch { toast("Не удалось скопировать"); }
}

async function share() {
  const url = state.me?.sub_url;
  if (!url) return;
  if (navigator.share) { try { await navigator.share({ title: "Wispie VPN", text: url }); return; } catch {} }
  copy(url);
}

function openUrl(url) {
  if (!url) return;
  if (url.startsWith("https://t.me/") && tg?.openTelegramLink) return tg.openTelegramLink(url);
  if (tg?.openLink) return tg.openLink(url);
  window.open(url, "_blank");
}

async function pay(days) {
  try { const { url } = await api("/api/pay", { days }); openUrl(url); }
  catch (e) { toast(e.message); }
}

async function topup(amount) {
  try { const { url } = await api("/api/topup", { amount }); openUrl(url); }
  catch (e) { toast(e.message); }
}

function pickTopup(v, el) {
  const inp = $("#topup_sum");
  if (!inp) return;
  inp.value = v;
  document.querySelectorAll("[data-topup]").forEach(b => b.classList.toggle("on", b === el));
  inp.classList.remove("pop");
  void inp.offsetWidth;
  inp.classList.add("pop");
}

function topupFromInput() {
  const v = +$("#topup_sum").value;
  if (!v) return toast("Введите сумму");
  topup(v);
}

async function payBalance(days) {
  try { await api("/api/pay_balance", { days }); toast("Подписка продлена с баланса"); await refresh(); }
  catch (e) { toast(e.message); }
}

/* ---------- навигация ---------- */

function buildTabs() {
  const keys = tabKeys();
  const bar = $("#tabs");
  bar.style.setProperty("--n", keys.length);
  bar.innerHTML = `<span class="pill"></span>` + keys.map(([k, label, ic]) =>
    `<button class="tab" data-t="${k}"><svg class="i"><use href="#i-${ic}"/></svg><span>${label}</span></button>`).join("");
  $("#side").innerHTML = `
    <div class="side-brand"><span class="side-logo"><svg class="i"><use href="#i-shield"/></svg></span>Wispie VPN</div>
    <nav class="side-nav">${keys.map(([k, label, ic]) =>
      `<button class="tab side-tab" data-t="${k}"><svg class="i"><use href="#i-${ic}"/></svg><span>${label}</span></button>`).join("")}</nav>
    <button class="side-news" data-open="https://t.me/+aCAYY1vkUyQxNmMy"><span>📰 Новости</span><small>Канал →</small></button>`;
  moveTabs();
}

function moveTabs() {
  const idx = Math.max(0, tabKeys().findIndex(t => t[0] === state.tab));
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.t === state.tab));
  const pill = $(".pill");
  if (pill) pill.style.transform = `translateX(${idx * 100}%)`;
}

/* ---------- главная ---------- */

function newsBar() {
  return `<button class="newsbar" data-open="https://t.me/+aCAYY1vkUyQxNmMy"><span>📰 Актуальные новости</span><small>Канал →</small></button>`;
}

function renderHome() {
  const m = state.me;
  const pct = m.active ? Math.min(100, Math.round(m.days_left / 30 * 100)) : 0;
  const hero = `
    <section class="glass hero">
      <div class="between">
        <span class="chip ${m.active ? "ok" : "bad"}"><i></i>${m.active ? "Активна" : "Не активна"}</span>
        <svg class="i" style="width:24px;height:24px;color:var(--accent-ink)"><use href="#i-shield"/></svg>
      </div>
      <div class="big">${m.active ? `${m.days_left} ${plural(m.days_left)}` : "Подключите VPN"}</div>
      <p class="muted small">${m.active ? `Действует до ${fmtDate(m.until)}` : "Выберите тариф, и доступ появится сразу после оплаты"}</p>
      <div class="bar"><span style="width:${pct}%"></span></div>
    </section>`;

  const devices = m.active ? `
    <section class="glass tap" data-t="sub">
      <div class="between">
        <div><h3>Устройства</h3><p class="tiny">${m.devices_used} из ${m.devices_limit} подключено</p></div>
        <button class="btn sm" data-expand-go>Расширить</button>
      </div>
    </section>` : "";

  const action = m.active ? "" : `
    <section class="glass">
      <h3>Начните за минуту</h3>
      <p class="muted small">Тарифы от 199 ₽. Оплата картой или СБП.</p>
      <button class="btn" data-go="plans">Выбрать тариф</button>
    </section>`;

  const renew = m.active ? `<button class="btn" data-go="plans">Продлить подписку</button>` : "";
  return `<p class="eyebrow">Личный кабинет</p><h1 class="title">Привет, ${esc(m.name)}</h1>`
    + hero + devices + action + renew + newsBar();
}

/* ---------- тарифы ---------- */

function renderPlans() {
  const m = state.me, d = m.discount_pct || 0;
  const balCard = `
    <section class="glass">
      <div class="between"><h3>Баланс</h3><b class="small">${m.balance} ₽</b></div>
      <p class="tiny">Пополните заранее. Подписку можно оплатить с баланса в один клик.</p>
      <div class="chips">${[250, 500, 1000].map(v => `<button class="chipb" data-topup="${v}">+${v} ₽</button>`).join("")}</div>
      <div class="row"><input id="topup_sum" placeholder="Своя сумма, ₽" inputmode="numeric"/>
        <button class="btn sm" data-action="topup">Пополнить</button></div>
    </section>`;
  const items = m.plans.map(p => {
    const price = Math.round(p.price * (100 - d) / 100);
    const perMonth = Math.round(price / (p.days / 30));
    const best = p.days === 60;
    const canBal = m.balance >= price;
    return `
      <article class="glass plan ${best ? "best" : ""}">
        ${best ? `<span class="tag">Выгодно</span>` : ""}
        <div class="plan-icon"><svg class="i"><use href="#i-money"/></svg></div>

const imgCache = new Map();
async function loadImages() {

  });
}

// Уменьшаем фото перед отправкой: быстрее и экономит трафик
function attachImage(file) {
  if (!file) return;
  if (!file.type.startsWith("image/")) return toast("Нужно изображение");
  const img = new Image();
  img.onload = () => {
    const k = Math.min(1, 1280 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * k);
    c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    state.pendingImg = c.toDataURL("image/jpeg", 0.85);
    URL.revokeObjectURL(img.src);
    renderPreview();
  };
  img.onerror = () => toast("Не удалось открыть фото");
  img.src = URL.createObjectURL(file);
}

// Читает картинку и уменьшает её; возвращает data URL
function readImage(file) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith("image/")) return reject(new Error("Нужно изображение"));
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k);
      c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = () => reject(new Error("Не удалось открыть фото"));
    img.src = URL.createObjectURL(file);
  });
}

      <div class="glass stat"><b>${s.payments}</b><span>оплат</span></div>
    </div>
    <section class="glass" style="margin-top:12px">
      <h3>Поиск</h3>
      <div class="row"><input id="q" placeholder="ID или @username"/><button class="btn sm" data-action="search">Найти</button></div>
      <div id="results"></div>
    </section>
    <section class="glass">
      <h3>Выдать дни</h3>
      <input id="g_id" placeholder="ID пользователя" inputmode="numeric"/>
      <div class="chips">${[3, 30, 60, 90].map(d => `<button class="chipb" data-days="${d}">+${d}</button>`).join("")}</div>
      <input id="g_days" placeholder="Количество дней" inputmode="numeric"/>
      <button class="btn" data-action="grant">Выдать</button>
    </section>
    <section class="glass">
      <h3>Промокоды</h3>
      <input id="c_code" placeholder="Код, например SALE20"/>
      <div class="row"><input id="c_pct" placeholder="Скидка %" inputmode="numeric"/><input id="c_max" placeholder="Лимит (0 = без)" inputmode="numeric"/></div>
      <button class="btn" data-action="coupon-add">Создать</button>
      <div style="margin-top:8px">${list}</div>
    </section>
    <section class="glass">
      <h3>Блокировка</h3>
      <input id="b_id" placeholder="ID пользователя" inputmode="numeric"/>
      <div class="row">
        <button class="btn ghost sm" data-action="ban">Заблокировать</button>
        <button class="btn ghost sm" data-action="unban">Разблокировать</button>
      </div>
    </section>`;
}

const views = { home: renderHome, plans: renderPlans, sub: renderSub, more: renderMore, support: renderSupportTab, admin: renderAdmin };

const cache = new Map();

// Загружает данные и сообщает, изменились ли они
async function fresh(path) {
  const d = await api(path);
  const str = JSON.stringify(d);
  const changed = !cache.has(path) || cache.get(path).str !== str;
  cache.set(path, { d, str });
  return changed;
}

async function getData(path) {
  if (cache.has(path)) return cache.get(path).d;
  await fresh(path);
  return cache.get(path).d;
}

const DATA_BY_TAB = {
  sub: ["/api/devices"],
  more: ["/api/payments"],
  support: ["/api/support"],
  admin: ["/api/admin/stats", "/api/admin/coupons"],
};

// Показывает сохранённые данные сразу, затем обновляет их в фоне
async function render(silent = false) {
  const my = ++renderId;
  const tab = state.tab;
  const paths = DATA_BY_TAB[tab] || [];
  const warm = paths.every(p => cache.has(p));
  if (!warm) $("#app").innerHTML = `<div class="view"><p class="tiny">Загрузка…</p></div>`;
  let html;
  try { html = await views[tab](); }
  catch (e) { html = `<section class="glass"><p class="muted">${esc(e.message)}</p></section>`; }
  if (my !== renderId) return;
  $("#app").innerHTML = `<div class="view${silent ? " noanim" : ""}${tab === "support" ? " single" : ""}">${html}</div>`;
  if (tab === "sub") drawQr();
  if (tab === "support") renderPreview();
  if (tab === "admin") renderAdmPreview();
  loadImages();
  const cb = $("#chatbox");
  if (cb) cb.scrollTop = cb.scrollHeight;
  if (paths.length) {
    const results = await Promise.all(paths.map(p => fresh(p).catch(() => false)));
    if (results.some(Boolean) && state.tab === tab && tab !== "support" && my === renderId) render(true);
  }
}

function drawQr() {
  const el = $("#qr");
  if (!el || !state.me?.sub_url || !window.QRCode) return;
  el.innerHTML = "";
  new QRCode(el, { text: state.me.sub_url, width: 170, height: 170,
    colorDark: "#1b2030", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
}

async function go(tab) {
  if (tab === state.tab && $("#app .view")) return;
  state.tab = tab;
  tg?.HapticFeedback?.selectionChanged?.();
  moveTabs();
  await render();
}

async function refresh() {
  try { state.me = await api("/api/me"); } catch { return; }
  if (!tabKeys().some(t => t[0] === state.tab)) state.tab = "home";
  buildTabs();
  render();
}

/* ---------- действия ---------- */

async function search() {
  const q = $("#q").value.trim();
  const list = await api(`/api/admin/users?q=${encodeURIComponent(q)}`);
  $("#results").innerHTML = list.map(u => `
    <div class="item" data-pick="${u.id}">
      <b class="small">${esc(u.first_name)}</b> <span class="tiny">${u.username ? "@" + esc(u.username) : ""} · ${u.id}</span>
      <div class="tiny">${u.sub_until ? "до " + fmtDate(u.sub_until) : "нет подписки"}${u.banned ? " · заблокирован" : ""}</div>
    </div>`).join("") || `<p class="tiny">Никого не нашли</p>`;
}

async function grant() {
  const user_id = +$("#g_id").value, days = +$("#g_days").value;
  if (!user_id || !days) return toast("Укажите ID и количество дней");
  try {
    const r = await api("/api/admin/grant", { user_id, days });
    toast(r.warning ? r.warning : `Выдано. Активна до ${fmtDate(r.until)}`);
  } catch (e) { toast(e.message); }
}

async function ban(flag) {
  const user_id = +$("#b_id").value;
  if (!user_id) return toast("Укажите ID");
  try { await api("/api/admin/ban", { user_id, banned: flag }); toast(flag ? "Заблокирован" : "Разблокирован"); }
  catch (e) { toast(e.message); }
}

async function addCoupon() {
  const code = $("#c_code").value.trim(), percent = +$("#c_pct").value, max_uses = +$("#c_max").value || 0;
  try { await api("/api/admin/coupons", { code, percent, max_uses }); toast("Промокод создан"); render(); }
  catch (e) { toast(e.message); }
}

async function couponOff(code) {
  try { await api("/api/admin/coupons/off", { code }); toast("Промокод выключен"); render(); }
  catch (e) { toast(e.message); }
}

async function applyCoupon() {
  const code = $("#promo").value.trim();
  if (!code) return toast("Введите код");
  try { const r = await api("/api/coupon", { code }); toast(`Скидка ${r.percent}% применена`); await refresh(); }
  catch (e) { toast(e.message); }
}

async function buy(item) {
  try { const r = await api("/api/shop/buy", { item }); toast(r.warning ? r.warning : "Готово"); await refresh(); }
  catch (e) { toast(e.message); }
}

async function devAdd() {
  try {
    const r = await api("/api/devices/add", {});
    copy(r.sub_url);
    toast("Устройство добавлено, ссылка скопирована");
    await refresh();
  } catch (e) { toast(e.message); }
}

async function devRevoke(id) {
  try { await api("/api/devices/revoke", { id: +id }); toast("Устройство отключено"); await refresh(); }
  catch (e) { toast(e.message); }
}

async function devBuy(method) {
  const count = state.addCount;
  try {
    const r = await api("/api/devices/buy", { count, method });
    if (r.url) return openUrl(r.url);
    state.expand = false;
    toast("Лимит устройств увеличен");
    await refresh();
  } catch (e) { toast(e.message); }
}

async function saveEmail() {
  const email = $("#email").value.trim();
  try { await api("/api/profile/email", { email }); toast("Email сохранён"); await refresh(); }
  catch (e) { toast(e.message); }
}

async function buyGift() {
  try {
    const r = await api("/api/gift", { days: state.giftDays });
    $("#giftres").innerHTML = `Код подарка: <b>${r.code}</b> <button class="btn ghost sm" data-copy="${r.code}" style="margin-left:6px">Копировать</button>`;
    await refresh();
  } catch (e) { toast(e.message); }
}

async function redeemGift() {
  const code = $("#gcode").value.trim();
  if (!code) return toast("Введите код");
  try {
    const r = await api("/api/gift/redeem", { code });
    toast(r.warning ? r.warning : "Подарок активирован");
    await refresh();
  } catch (e) { toast(e.message); }
}

function spinOff() {}

/* ---------- клики и ввод ---------- */

document.addEventListener("click", e => {
  if (e.target.tagName === "IMG" && e.target.dataset.img) return openViewer(e.target.src);
  const el = e.target.closest("[data-t],[data-go],[data-pay],[data-paybal],[data-topup],[data-action],[data-pick],[data-days],[data-theme],[data-more],[data-buy],[data-pf],[data-guide],[data-step],[data-off],[data-open],[data-gday],[data-gift],[data-redeem],[data-email],[data-copy],[data-revoke],[data-devbuy],[data-devadd],[data-expand],[data-expand-go],[data-share],[data-sup-send],[data-sup-attach],[data-sup-clear],[data-adm-open],[data-adm-back],[data-tpl],[data-adm-reply],[data-adm-close],[data-adm-attach],[data-adm-clear-img],[data-admban]");
  if (!el) return;
  const d = el.dataset;
  if (d.theme) return setTheme(d.theme);
  if (d.t) return go(d.t);
  if (d.expandGo !== undefined) { state.expand = true; return go("sub"); }
  if (d.go) return go(d.go);
  if (d.more) { state.moreSub = d.more; return render(); }
  if (d.buy) return buy(d.buy);
  if (d.pf) return updatePlatform(d.pf);
  if (d.guide) { state.guideOpen = true; state.step = 0; return updateGuide(); }
  if (d.step) {
    const n = PLATFORMS[state.platform].steps.length;
    if (d.step === "next") { if (state.step < n - 1) state.step++; else { state.guideOpen = false; state.step = 0; } }
    else if (state.step > 0) state.step--;
    return updateGuide();
  }
  if (d.off) return couponOff(d.off);
  if (d.open) return openUrl(d.open);
  if (d.topup) return pickTopup(+d.topup, el);
  if (d.paybal) return payBalance(+d.paybal);
  if (d.pay) return pay(+d.pay);
  if (d.pick) { const f = $("#g_id"); if (f) f.value = d.pick; return; }
  if (d.days) { const f = $("#g_days"); if (f) f.value = d.days; return; }
  if (d.gday) { state.giftDays = +d.gday; return render(); }
  if (d.gift !== undefined) return buyGift();
  if (d.redeem !== undefined) return redeemGift();
  if (d.email !== undefined) return saveEmail();
  if (d.copy) return copy(d.copy);
  if (d.supSend !== undefined) return sendSupport();
  if (d.supAttach !== undefined) return $("#sup_file")?.click();
  if (d.supClear !== undefined) { state.pendingImg = null; return renderPreview(); }
  if (d.admOpen) { state.adminUser = +d.admOpen; return render(); }
  if (d.admBack !== undefined) { state.adminUser = null; return render(); }
  if (d.admban) return banUser(+d.admban);
  if (d.tpl !== undefined) { $("#adm_text").value = TEMPLATES[+d.tpl]; return; }
  if (d.admAttach !== undefined) return $("#adm_file")?.click();
  if (d.admClearImg !== undefined) { state.admImg = null; return renderAdmPreview(); }
  if (d.admReply !== undefined) return admSend(false);
  if (d.admClose !== undefined) return admSend(true);
  if (d.share !== undefined) return share();
  if (d.revoke) return devRevoke(d.revoke);
  if (d.devbuy) return devBuy(d.devbuy);
  if (d.devadd !== undefined) return devAdd();
  if (d.expand !== undefined) return toggleExpand(el);
  switch (d.action) {
    case "copy-ref": return copy(state.me.ref_link);
    case "coupon": return applyCoupon();
    case "coupon-add": return addCoupon();
    case "topup": return topupFromInput();
    case "search": return search();
    case "grant": return grant();
    case "ban": return ban(true);
    case "unban": return ban(false);
  }
});

// Слайдер: точки заполняются по мере движения, текущая светится
document.addEventListener("input", e => {
  if (e.target.id !== "devslider" || !state.devInfo) return;
  const dv = state.devInfo, k = +e.target.value;
  state.addCount = k;
  document.querySelectorAll(".sdot").forEach((el, i) => {
    el.classList.toggle("on", i < k);
    el.classList.toggle("cur", i === k - 1);
  });
  $("#devlabel").textContent = `Расширится до ${dv.limit + k} устройств`;
  $("#devprice").textContent = `${priceFor(dv, k)} ₽`;
});

document.addEventListener("visibilitychange", () => { if (!document.hidden && state.me) refresh(); });

// Просмотр фото на весь экран: тап по фото — увеличить, тап по фону — закрыть
function openViewer(src) {
  const v = document.createElement("div");
  v.className = "viewer";
  v.innerHTML = `<img src="${src}" alt="фото"><button class="viewer-x" aria-label="Закрыть">✕</button>`;
  const img = v.querySelector("img");
  img.addEventListener("click", e => { e.stopPropagation(); img.classList.toggle("z"); });
  v.addEventListener("click", e => {
    if (e.target === v || e.target.classList.contains("viewer-x")) v.remove();
  });
  document.body.appendChild(v);
}

document.addEventListener("input", e => {
  if (e.target.id !== "topup_sum") return;
  const v = +e.target.value;
  document.querySelectorAll("[data-topup]").forEach(b => b.classList.toggle("on", +b.dataset.topup === v));
});

document.addEventListener("change", e => {
  if (e.target.id === "adm_file") {
    readImage(e.target.files[0])
      .then(url => { state.admImg = url; renderAdmPreview(); })
      .catch(err => toast(err.message));
    e.target.value = "";
  }
  if (e.target.id === "sup_file") { attachImage(e.target.files[0]); e.target.value = ""; }
});

document.addEventListener("keydown", e => {
  if (e.target.id === "sup_in" && e.key === "Enter") { e.preventDefault(); sendSupport(); }
});

/* ---------- фон по теме ---------- */

const cv = $("#bg"), ctx = cv.getContext("2d");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let W = 0, H = 0, DPR = 1, parts = [], raf = 0;

function sizeBg() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.width = Math.round(innerWidth * DPR);
  H = cv.height = Math.round(innerHeight * DPR);
}

const rnd = (a, b) => a + Math.random() * (b - a);

function makePart(mode, scatter) {
  const c = fx.colors[Math.floor(Math.random() * fx.colors.length)];
  if (mode === "orbs") {
    return { x: rnd(0, W), y: rnd(0, H), r: rnd(160, 300) * DPR,
             vx: rnd(-.12, .12) * DPR, vy: rnd(-.1, .1) * DPR, c, a: rnd(.14, .3) };
  }
  if (mode === "stars") {
    return { x: rnd(0, W), y: scatter ? rnd(0, H) : -5 * DPR, r: rnd(.8, 1.7) * DPR,
             vy: rnd(.25, .55) * DPR, vx: rnd(-.04, .04) * DPR, ph: rnd(0, 6.28), c };
  }
  return { x: rnd(0, W), y: scatter ? rnd(0, H) : H + 5 * DPR, r: rnd(1, 2) * DPR,
           vy: -rnd(.25, .55) * DPR, ph: rnd(0, 6.28), c };
}

function resetBg() {
  sizeBg();
  const area = (innerWidth * innerHeight) / (390 * 844);
  const n = Math.max(1, Math.round(fx.count * area));
  parts = Array.from({ length: n }, () => makePart(fx.mode, true));
  cancelAnimationFrame(raf);
  drawBg();
}

function drawBg() {
  ctx.clearRect(0, 0, W, H);
  const mode = fx.mode;
  for (const p of parts) {
    if (!reduceMotion) {
      if (mode === "orbs") { p.x += p.vx; p.y += p.vy; }
      else { p.y += p.vy; p.x += p.vx + Math.sin(p.ph + p.y * .01) * .15 * DPR; }
      p.ph += .02;
    }
    if (mode === "orbs") {
      if (p.x < -p.r) p.x = W + p.r;
      if (p.x > W + p.r) p.x = -p.r;
      if (p.y < -p.r) p.y = H + p.r;
      if (p.y > H + p.r) p.y = -p.r;
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      g.addColorStop(0, `rgba(${p.c},${p.a})`);
      g.addColorStop(1, `rgba(${p.c},0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    } else if (mode === "stars") {
      if (p.y > H + 5 * DPR) Object.assign(p, makePart("stars", false));
      ctx.fillStyle = `rgba(${p.c},${.5 + .5 * Math.sin(p.ph)})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    } else {
      if (p.y < -5 * DPR) Object.assign(p, makePart("embers", false));
      ctx.shadowBlur = 8 * DPR;
      ctx.shadowColor = `rgba(${p.c},.8)`;
      ctx.fillStyle = `rgba(${p.c},${.45 + .4 * Math.sin(p.ph)})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  if (!reduceMotion && !document.hidden) raf = requestAnimationFrame(drawBg);
}

addEventListener("resize", resetBg);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && !reduceMotion) { cancelAnimationFrame(raf); drawBg(); }
});

/* ---------- запрет масштабирования жестами ---------- */
["gesturestart","gesturechange","gestureend"].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener("wheel", e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });

/* ---------- старт ---------- */

(async () => {
  let saved = null;
  try { saved = localStorage.getItem("wispie-theme"); } catch {}
  applyTheme(THEMES[saved] ? saved : tgTheme());
  try { tg?.onEvent?.("themeChanged", () => { if (!localStorage.getItem("wispie-theme")) applyTheme(tgTheme()); }); } catch {}
  try { state.me = await api("/api/me"); }
  catch (e) {
    $("#app").innerHTML = `<div class="glass" style="margin-top:30px;text-align:center"><h2 class="title">Откройте в Telegram</h2><p class="muted">${esc(e.message)}</p></div>`;
    return;
  }
  const q = new URLSearchParams(location.search);
  if (q.get("s")) state.moreSub = q.get("s") === "shop" ? "shop" : q.get("s") === "friends" ? "friends" : "profile";
  const want = q.get("tab");
  if (want && tabKeys().some(t => t[0] === want)) state.tab = want;
  buildTabs();
  await render();
})();
</script>
