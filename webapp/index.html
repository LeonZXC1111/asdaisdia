.res{text-align:center;font-weight:800;min-height:26px;margin:8px 0 2px}

.coinwrap,.slotwrap{display:flex;justify-content:center;align-items:center;height:130px;perspective:600px}
.coin{width:112px;height:112px;border-radius:50%;background:linear-gradient(135deg,#f7dc86,#c9962e);display:grid;place-items:center;

.coin.spin{animation:flip .9s linear}

.pointer{position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:18px solid var(--navy);z-index:2}

.tabbar::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 35%,rgba(255,255,255,0) 70%,rgba(255,255,255,.18) 100%)}

.tab{position:relative;z-index:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 8px;color:var(--ink3);font:700 10.5px 'Manrope',sans-serif;cursor:pointer;transition:color .3s}
.tab .i{transition:transform .45s var(--ease),fill-opacity .3s}

  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:toastIn .35s var(--ease) both;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  grey:   { name:"Серая",     swatch:"#c9cfd9", tg:"#c9cfd9", fx:{ mode:"orbs",   count:7,  colors:["255,255,255","140,150,172"] } },
  white:  { name:"Белая",     swatch:"#f3f4f7", tg:"#e4e7ed", fx:{ mode:"orbs",   count:6,  colors:["255,205,160","160,190,255","255,255,255"] } },
  black:  { name:"Черная",    swatch:"#101218", tg:"#06070a", fx:{ mode:"stars",  count:40, colors:["230,236,255"] } },
  galaxy: { name:"Галактика", swatch:"#3b1f6e", tg:"#0a0920", fx:{ mode:"stars",  count:45, colors:["225,215,255","160,230,255","255,235,200"] } },
  red:    { name:"Красная",   swatch:"#7a1622", tg:"#120508", fx:{ mode:"embers", count:28, colors:["255,120,130","255,190,120"] } },
};
let fx = THEMES.grey.fx;

function setTheme(key) {
  if (!THEMES[key]) return;
  const t = THEMES[key];
  document.documentElement.dataset.theme = key;
  fx = t.fx;
  resetBg();
  try { localStorage.setItem("wispie-theme", key); } catch {}
  try { tg?.setHeaderColor?.(t.tg); tg?.setBackgroundColor?.(t.tg); } catch {}
  document.querySelectorAll(".swcol").forEach(b => b.classList.toggle("on", b.dataset.theme === key));
}

function themeCard() {
  const cur = document.documentElement.dataset.theme || "grey";
  return `
    <section class="glass">
      <h3>Оформление</h3>
      <div class="swatches" style="display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px">${Object.entries(THEMES).map(([k, t]) => `
        <button class="swcol ${k === cur ? "on" : ""}" data-theme="${k}" style="display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:0;color:var(--ink2);font:700 10.5px 'Manrope',sans-serif;cursor:pointer">
          <span class="sw" style="width:40px;height:40px;border-radius:50%;background:${t.swatch};box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),0 4px 10px rgba(0,0,0,.18)"></span>${t.name}
        </button>`).join("")}
      </div>
    </section>`;
}

const state = {
  me: null, tab: "home", moreSub: "friends",
  platform: "windows", guideOpen: false, step: 0,
};
let renderId = 0, busy = false;

const plural = n => { const a = n % 100, b = n % 10; if (a > 10 && a < 20) return "дней"; if (b === 1) return "день"; if (b >= 2 && b <= 4) return "дня"; return "дней"; };
const fmtDate = iso => new Date(iso).toLocaleDateString("ru-RU", {day:"numeric", month:"long", year:"numeric"});
const TABS = [["home","Главная","home"],["plans","Тарифы","money"],["sub","Подписка","link"],["more","Остальное","users"],["admin","Админ","shield"]];
const tabKeys = () => TABS.filter(([k]) =>
  k === "sub" ? state.me?.active : k === "admin" ? state.me?.is_admin : true);

async function api(path, body) {
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: {"Content-Type": "application/json", "X-Init-Data": INIT},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    const d = data.detail;
    throw new Error(typeof d === "string" ? d : "Ошибка запроса");
  }
  return data;
}

function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Скопировано"); }
  catch { toast("Не удалось скопировать"); }
}

async function share() {
  const url = state.me?.sub_url;
  if (!url) return;
  if (navigator.share) {
    try { await navigator.share({ title: "Wispie VPN", text: url }); return; } catch {}
  }
  copy(url);
}

async function pay(days) {
  try {
    const { url } = await api("/api/pay", { days });
    tg?.openLink ? tg.openLink(url) : window.open(url, "_blank");
  } catch (e) { toast(e.message); }
}

/* ---------- навигация ---------- */

function buildTabs() {
  const keys = tabKeys();
  const bar = $("#tabs");
  bar.style.setProperty("--n", keys.length);
  bar.innerHTML = `<span class="pill"></span>` + keys.map(([k, label, ic]) =>
    `<button class="tab" data-t="${k}"><svg class="i"><use href="#i-${ic}"/></svg><span>${label}</span></button>`).join("");
  moveTabs();
}

function moveTabs() {
  const idx = Math.max(0, tabKeys().findIndex(t => t[0] === state.tab));
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.t === state.tab));
  const pill = $(".pill");
  if (pill) pill.style.transform = `translateX(${idx * 100}%)`;
}

function renderPlans() {

    </section>`;
  const box = d
    ? `<section class="glass"><h3>Скидка ${d}% активна</h3><p class="muted">Применится к следующей оплате.</p></section>`
    : `<section class="glass">

    const price = Math.round(p.price * (100 - d) / 100);

    return `
      <article class="glass plan ${best ? "best" : ""}">

function guideBlock(p) {
  if (!state.guideOpen) return `<button class="btn" data-guide="1">Начать настройку</button>`;
  const n = p.steps.length, i = state.step, last = i === n - 1;
  const dots = p.steps.map((_, k) => `<i class="${k <= i ? "on" : ""}"></i>`).join("");
  return `
    <div class="steps-dots">${dots}</div>
    <div class="stepbox"><b>Шаг ${i + 1}.</b> ${esc(p.steps[i])}</div>
    <div class="row2">
      <button class="btn ghost" data-step="prev" ${i === 0 ? "disabled" : ""}>Назад</button>
      <button class="btn" data-step="next">${last ? "Готово" : "Далее"}</button>
    </div>`;
}

const views = { home: renderHome, plans: renderPlans, sub: renderSub, more: renderMore, admin: renderAdmin };

async function render() {
  const my = ++renderId;
  let html;
  try { html = await views[state.tab](); }
  catch (e) { html = `<section class="glass"><p class="muted">${esc(e.message)}</p></section>`; }
  if (my !== renderId) return;
  $("#app").innerHTML = `<div class="view">${html}</div>`;
  if (state.tab === "sub") drawQr();
}

function drawQr() {
  const el = $("#qr");
  if (!el || !state.me?.sub_url || !window.QRCode) return;
  el.innerHTML = "";
  new QRCode(el, { text: state.me.sub_url, width: 180, height: 180,
    colorDark: "#1b2030", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
}

async function go(tab) {
  if (tab === state.tab && $("#app .view")) return;
  state.tab = tab;
  tg?.HapticFeedback?.selectionChanged?.();
  moveTabs();
  await render();
}

async function refresh() {
  try { state.me = await api("/api/me"); } catch { return; }
  if (!tabKeys().some(t => t[0] === state.tab)) state.tab = "home";
  buildTabs();
  render();
}

/* ---------- действия ---------- */

async function search() {
  const q = $("#q").value.trim();
  const list = await api(`/api/admin/users?q=${encodeURIComponent(q)}`);
  $("#results").innerHTML = list.map(u => `
    <div class="item" data-pick="${u.id}">
      <b>${esc(u.first_name)}</b> <span class="muted small">${u.username ? "@" + esc(u.username) : ""} · ${u.id}</span>
      <div class="muted small">${u.sub_until ? "до " + fmtDate(u.sub_until) : "нет подписки"}${u.banned ? " · заблокирован" : ""}</div>
    </div>`).join("") || `<p class="muted">Никого не нашли</p>`;
}

async function grant() {
  const user_id = +$("#g_id").value, days = +$("#g_days").value;
  if (!user_id || !days) return toast("Укажите ID и количество дней");
  try {
    const r = await api("/api/admin/grant", { user_id, days });
    toast(r.warning ? r.warning : `Выдано. Активна до ${fmtDate(r.until)}`);
  } catch (e) { toast(e.message); }
}

async function ban(flag) {
  const user_id = +$("#b_id").value;
  if (!user_id) return toast("Укажите ID");
  try {
    await api("/api/admin/ban", { user_id, banned: flag });
    toast(flag ? "Заблокирован" : "Разблокирован");
  } catch (e) { toast(e.message); }
}

async function addCoupon() {
  const code = $("#c_code").value.trim(), percent = +$("#c_pct").value, max_uses = +$("#c_max").value || 0;
  try {
    await api("/api/admin/coupons", { code, percent, max_uses });
    toast("Промокод создан");
    render();
  } catch (e) { toast(e.message); }
}

async function couponOff(code) {
  try { await api("/api/admin/coupons/off", { code }); toast("Промокод выключен"); render(); }
  catch (e) { toast(e.message); }
}

async function applyCoupon() {
  const code = $("#promo").value.trim();
  if (!code) return toast("Введите код");
  try {
    const r = await api("/api/coupon", { code });
    toast(`Скидка ${r.percent}% применена`);
    await refresh();
  } catch (e) { toast(e.message); }
}

async function buy(item) {
  try {
    const r = await api("/api/shop/buy", { item });
    toast(r.warning ? r.warning : "Готово");
    await refresh();
  } catch (e) { toast(e.message); }
}

async function topup(amount) {
  try {
    const { url } = await api("/api/topup", { amount });
    openUrl(url);
  } catch (e) { toast(e.message); }
}

function topupFromInput() {
  const v = +$("#topup_sum").value;
  if (!v) return toast("Введите сумму");
  topup(v);
}

async function payBalance(days) {
  try {
    await api("/api/pay_balance", { days });
    toast("Подписка продлена с баланса");
    await refresh();
  } catch (e) { toast(e.message); }
}

async function shareOrCopy() { await share(); }

function openUrl(url) {
  if (!url) return;
  if (url.startsWith("https://t.me/") && tg?.openTelegramLink) return tg.openTelegramLink(url);
  if (tg?.openLink) return tg.openLink(url);
  window.open(url, "_blank");
}

/* ---------- клики ---------- */

document.addEventListener("click", e => {
  const el = e.target.closest("[data-t],[data-go],[data-pay],[data-action],[data-pick],[data-days],[data-theme],[data-more],[data-buy],[data-pf],[data-guide],[data-step],[data-off],[data-open],[data-topup],[data-paybal]");
  if (!el) return;
  const d = el.dataset;
  if (d.theme) return setTheme(d.theme);
  if (d.t) return go(d.t);
  if (d.go) return go(d.go);
  if (d.more) { state.moreSub = d.more; return render(); }
  if (d.buy) return buy(d.buy);
  if (d.pf) { state.platform = d.pf; state.guideOpen = false; state.step = 0; return render(); }
  if (d.guide) { state.guideOpen = true; state.step = 0; return render(); }
  if (d.step) {
    const n = PLATFORMS[state.platform].steps.length;
    if (d.step === "next") {
      if (state.step < n - 1) state.step++; else { state.guideOpen = false; state.step = 0; }
    } else if (state.step > 0) state.step--;
    return render();
  }
  if (d.open) return openUrl(d.open);
  if (d.topup) return topup(+d.topup);
  if (d.paybal) return payBalance(+d.paybal);
  if (d.off) return couponOff(d.off);
  if (d.pay) return pay(+d.pay);
  if (d.pick) { const f = $("#g_id"); if (f) f.value = d.pick; return; }
  if (d.days) { const f = $("#g_days"); if (f) f.value = d.days; return; }
  switch (d.action) {
    case "copy-sub": return copy(state.me.sub_url);
    case "share": return shareOrCopy();
    case "copy-ref": return copy(state.me.ref_link);
    case "coupon": return applyCoupon();
    case "topup": return topupFromInput();
    case "coupon-add": return addCoupon();
    case "search": return search();
    case "grant": return grant();
    case "ban": return ban(true);
    case "unban": return ban(false);
  }
});

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && state.me) refresh();
});

/* ---------- фон по теме ---------- */

const cv = $("#bg"), ctx = cv.getContext("2d");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let W = 0, H = 0, DPR = 1, parts = [], raf = 0;

function sizeBg() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.width = Math.round(innerWidth * DPR);
  H = cv.height = Math.round(innerHeight * DPR);
}

const rnd = (a, b) => a + Math.random() * (b - a);

function makePart(mode, scatter) {
  const c = fx.colors[Math.floor(Math.random() * fx.colors.length)];
  if (mode === "orbs") {
    return { x: rnd(0, W), y: rnd(0, H), r: rnd(160, 300) * DPR,
             vx: rnd(-.12, .12) * DPR, vy: rnd(-.1, .1) * DPR, c, a: rnd(.14, .3) };
  }
  if (mode === "stars") {
    return { x: rnd(0, W), y: scatter ? rnd(0, H) : -5 * DPR, r: rnd(.8, 1.7) * DPR,
             vy: rnd(.25, .55) * DPR, vx: rnd(-.04, .04) * DPR, ph: rnd(0, 6.28), c };
  }
  return { x: rnd(0, W), y: scatter ? rnd(0, H) : H + 5 * DPR, r: rnd(1, 2) * DPR,
           vy: -rnd(.25, .55) * DPR, ph: rnd(0, 6.28), c };
}

function resetBg() {
  sizeBg();
  const area = (innerWidth * innerHeight) / (390 * 844);
  const n = Math.max(1, Math.round(fx.count * area));
  parts = Array.from({ length: n }, () => makePart(fx.mode, true));
  cancelAnimationFrame(raf);
  drawBg();
}

function drawBg() {
  ctx.clearRect(0, 0, W, H);
  const mode = fx.mode;
  for (const p of parts) {
    if (!reduceMotion) {
      if (mode === "orbs") { p.x += p.vx; p.y += p.vy; }
      else { p.y += p.vy; p.x += p.vx + Math.sin(p.ph + p.y * .01) * .15 * DPR; }
      p.ph += .02;
    }
    if (mode === "orbs") {
      if (p.x < -p.r) p.x = W + p.r;
      if (p.x > W + p.r) p.x = -p.r;
      if (p.y < -p.r) p.y = H + p.r;
      if (p.y > H + p.r) p.y = -p.r;
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      g.addColorStop(0, `rgba(${p.c},${p.a})`);
      g.addColorStop(1, `rgba(${p.c},0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    } else if (mode === "stars") {
      if (p.y > H + 5 * DPR) Object.assign(p, makePart("stars", false));
      ctx.fillStyle = `rgba(${p.c},${.5 + .5 * Math.sin(p.ph)})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    } else {
      if (p.y < -5 * DPR) Object.assign(p, makePart("embers", false));
      ctx.shadowBlur = 8 * DPR;
      ctx.shadowColor = `rgba(${p.c},.8)`;
      ctx.fillStyle = `rgba(${p.c},${.45 + .4 * Math.sin(p.ph)})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  }
  if (!reduceMotion && !document.hidden) raf = requestAnimationFrame(drawBg);
}

function startBg() { resetBg(); }

addEventListener("resize", resetBg);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && !reduceMotion) { cancelAnimationFrame(raf); drawBg(); }
});

/* ---------- старт ---------- */

(async () => {
  let saved = null;
  try { saved = localStorage.getItem("wispie-theme"); } catch {}
  setTheme(THEMES[saved] ? saved : "grey");
  startBg();
  try { state.me = await api("/api/me"); }
  catch (e) {
    $("#app").innerHTML = `<div class="glass" style="margin-top:30px;text-align:center"><h2 class="title">Откройте в Telegram</h2><p class="muted">${esc(e.message)}</p></div>`;
    return;
  }
  const q = new URLSearchParams(location.search);
  if (q.get("s")) state.moreSub = q.get("s");
  const want = q.get("tab");
  if (want && tabKeys().some(t => t[0] === want)) state.tab = want;
  buildTabs();
  await render();
})();
</script>
